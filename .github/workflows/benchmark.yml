name: ORM Execution Benchmarks

on:
  workflow_dispatch:
  schedule:
    # Run every Sunday at midnight UTC
    - cron: '0 0 * * 0'

jobs:
  gate:
    name: Check Benchmark CI Gate
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Evaluate CI Gate
        id: check
        run: node scripts/ci-gate.js benchmark

  benchmark:
    name: Run ORM Execution Comparison Benchmarks
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build EntityTS
        run: pnpm run build

      - name: Run benchmark execution suite
        run: pnpm run benchmark
