name: Release & Semantic Versioning

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  gate:
    name: Check Release CI Gate
    runs-on: ubuntu-latest
    if: >-
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, '[ci skip]') &&
      !contains(github.event.head_commit.message, '[skip release]')
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Evaluate CI Gate
        id: check
        run: node scripts/ci-gate.js release ${{ github.event_name }}

  release:
    name: Semantic Release & Version Bump
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify build before release
        run: pnpm run build

      - name: Run Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets['NPM_TOKEN'] }}
        run: npx semantic-release
