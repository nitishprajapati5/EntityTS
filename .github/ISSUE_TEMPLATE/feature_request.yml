name: 💡 Feature Request
description: Suggest a new idea, database driver, or enhancement for EntityTS
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping make EntityTS better! Please describe your proposed feature or improvement below.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement / Motivation
      description: Is your feature request related to a problem or missing capability?
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution & Use Case
      description: Describe the solution you'd like to see and how it would work in practice.
    validations:
      required: true

  - type: textarea
    id: api-example
    attributes:
      label: Proposed API / Code Example
      description: Show how developers would write code using this new feature.
      render: typescript
      placeholder: |
        // Example of the proposed syntax:
        await db.users.someNewFeature();
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you have considered.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, benchmarks, or references (e.g. EF Core or Prisma features).
